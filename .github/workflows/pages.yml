name: Install page

# Builds Ferry, signs it with your certificate and profile, and publishes an install
# page on GitHub Pages. Each person runs this in their own copy of the repository.
#
# The easy way to provide the certificate and profile is the page itself
# ("Sign with your certificate"): it encrypts them in the browser, saves them as the
# secrets below, starts this workflow, and can delete them again afterwards.
#   SIGNING_CERTIFICATE_P12        base64 of your .p12
#   SIGNING_CERTIFICATE_PASSWORD   the .p12 password
#   PROVISIONING_PROFILE           base64 of your .mobileprovision
#   INSTALL_KEY                    optional: private mode. The signed app is published
#                                  under i/<key>/ (only reachable with the link) and
#                                  removed again after `keep_minutes`.
# Bundle ID: the `bundle_id` input, or the repository variable APP_BUNDLE_ID.

on:
  push:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID to sign as (optional; must be covered by the profile)
        required: false
        type: string
      keep_minutes:
        description: Private mode only. Minutes before the signed app is taken down (0 = keep it)
        required: false
        type: string
        default: "30"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # to delete the uploaded site copy after deploying

jobs:
  check:
    # GitHub Pages deploys from the default branch only, and must be switched on
    # (Settings › Pages › Source: GitHub Actions). Until then this skips quietly.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outputs.base_url == ''
        run: |
          echo "::notice::GitHub Pages isn't enabled yet. Turn it on in Settings › Pages (Source: GitHub Actions), then re-run this workflow."

  build:
    needs: check
    if: needs.check.outputs.base_url != ''
    runs-on: xcode-27
    outputs:
      private: ${{ steps.site.outputs.private }}
      keep_minutes: ${{ steps.site.outputs.keep_minutes }}
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' && secrets.PROVISIONING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Ferry.xcodeproj \
            -scheme Ferry \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          APP=build/Build/Products/Release-iphoneos/Ferry.app
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" >> "$GITHUB_ENV"
          mkdir -p unsigned/Payload
          cp -R "$APP" unsigned/Payload/
          (cd unsigned && zip -qry ../Ferry-unsigned.ipa Payload)

      - name: Sign app
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          APP_BUNDLE_ID: ${{ inputs.bundle_id || vars.APP_BUNDLE_ID }}
        run: scripts/ci_sign_app.sh "$APP" Ferry.ipa signing-info.json

      - name: No signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::No certificate is saved, so the page only offers the unsigned build. Use “Sign with your certificate” on the page."

      - name: Assemble site
        id: site
        env:
          INSTALL_KEY: ${{ secrets.INSTALL_KEY }}
          KEEP_MINUTES: ${{ inputs.keep_minutes || '30' }}
          BASE_URL: ${{ needs.check.outputs.base_url }}
        run: |
          COMMON=(--base-url "$BASE_URL" --version "$APP_VERSION" --build "$APP_BUILD"
                  --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --unsigned-ipa Ferry-unsigned.ipa)
          KEEP=$(python3 -c 'import sys; v=sys.argv[1]; print(max(0, min(240, int(v))) if v.isdigit() else 30)' "$KEEP_MINUTES")
          PRIVATE=false
          SIGNED=()
          if [ -f Ferry.ipa ]; then
            SIGNED=(--signed-ipa Ferry.ipa --signing-info signing-info.json)
            if [ -n "$INSTALL_KEY" ]; then
              PRIVATE=true
              SIGNED+=(--install-key "$INSTALL_KEY")
              if [ "$KEEP" -gt 0 ]; then
                EXPIRES=$(python3 -c 'import datetime,sys; print((datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=int(sys.argv[1]))).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$KEEP")
                SIGNED+=(--expires-at "$EXPIRES")
              fi
            fi
          fi
          python3 scripts/build_site.py _site "${COMMON[@]}" "${SIGNED[@]}"
          # The same site without the signed app, used to take it down later.
          python3 scripts/build_site.py _site_public "${COMMON[@]}"
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          echo "keep_minutes=$KEEP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - if: steps.site.outputs.private == 'true' && steps.site.outputs.keep_minutes != '0'
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site_public
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete the uploaded copy of the site
        # The deployed site is what's served; the run's copy (which holds the signed
        # app) would otherwise stay downloadable from this run for a day.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          for id in $(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" |
                      python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin)["artifacts"] if a["name"] == "github-pages"))'); do
            api -X DELETE "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted artifact $id"
          done

  expire:
    # Private mode: wait, then take the signed app down again.
    needs: [build, deploy]
    if: needs.build.outputs.private == 'true' && needs.build.outputs.keep_minutes != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - run: sleep $(( ${{ needs.build.outputs.keep_minutes }} * 60 ))

  unpublish:
    needs: [check, build, expire]
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Is this build still the one being served?
        id: current
        env:
          BASE_URL: ${{ needs.check.outputs.base_url }}
        run: |
          LIVE=$(curl -fsSL "${BASE_URL%/}/info.json?t=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("runId",""))' || true)
          if [ "$LIVE" = "$GITHUB_RUN_ID" ]; then
            echo "serving=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer build is live; it takes care of its own removal."
          fi
      - if: steps.current.outputs.serving == 'true'
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: _site_public
      - if: steps.current.outputs.serving == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_public
          retention-days: 1
      - if: steps.current.outputs.serving == 'true'
        uses: actions/deploy-pages@v4
      - name: Delete leftover artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          for id in $(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" |
                      python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin)["artifacts"]))'); do
            api -X DELETE "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
