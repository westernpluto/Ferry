name: Install page

# Builds the app, signs it with your certificate and profile (repository secrets),
# and publishes an install page on GitHub Pages. Open the page in Safari on the
# iPhone and tap Install.
#
# Secrets (Settings › Secrets and variables › Actions):
#   SIGNING_CERTIFICATE_P12        base64 of your .p12   (base64 -i cert.p12 | pbcopy)
#   SIGNING_CERTIFICATE_PASSWORD   the .p12 password
#   PROVISIONING_PROFILE           base64 of your .mobileprovision
# Optional repository variable:
#   APP_BUNDLE_ID                  bundle ID to sign as (must match the profile)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # GitHub Pages deploys from the default branch only, and must be switched on
    # (Settings › Pages › Source: GitHub Actions). Until then this skips quietly.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outputs.base_url == ''
        run: |
          echo "::notice::GitHub Pages isn't enabled yet. Turn it on in Settings › Pages (Source: GitHub Actions), then re-run this workflow."

  build:
    needs: check
    if: needs.check.outputs.base_url != ''
    runs-on: xcode-27
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' && secrets.PROVISIONING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Ferry.xcodeproj \
            -scheme Ferry \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          APP=build/Build/Products/Release-iphoneos/Ferry.app
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" >> "$GITHUB_ENV"
          mkdir -p unsigned/Payload
          cp -R "$APP" unsigned/Payload/
          (cd unsigned && zip -qry ../Ferry-unsigned.ipa Payload)

      - name: Sign app
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: scripts/ci_sign_app.sh "$APP" Ferry.ipa signing-info.json

      - name: No signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Signing secrets aren't set, so the page will only offer the unsigned build. See the comments at the top of pages.yml."

      - name: Assemble site
        run: |
          ARGS=()
          if [ -f Ferry.ipa ]; then
            ARGS+=(--signed-ipa Ferry.ipa --signing-info signing-info.json)
          fi
          python3 scripts/build_site.py _site \
            --base-url "${{ needs.check.outputs.base_url }}" \
            --version "$APP_VERSION" --build "$APP_BUILD" --commit "$GITHUB_SHA" \
            --unsigned-ipa Ferry-unsigned.ipa "${ARGS[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
