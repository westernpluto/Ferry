# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# Build with Xcode 27.1 or later (iOS 27.1 SDK) so the app fills both iPhone Duo displays.
name: Ferry
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  ZSignKit:
    path: Packages/ZSignKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Ferry:
    type: application
    platform: iOS
    sources:
      - path: Ferry
    dependencies:
      - package: ZIPFoundation
      - package: ZSignKit
    info:
      path: Ferry/Info.plist
      properties:
        CFBundleDisplayName: Ferry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Layout follows size classes, so every orientation and the iPhone Duo's
        # inner display (which ignores orientation locks) are supported.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
          - CFBundleTypeName: Provisioning Profile
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.mobileprovision
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobileprovision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Ferry
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FerryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FerryTests
    dependencies:
      - target: Ferry
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FerryTests

schemes:
  Ferry:
    build:
      targets:
        Ferry: all
        FerryTests: [test]
    test:
      targets:
        - FerryTests
